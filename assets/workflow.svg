<svg viewBox="0 0 1180 730" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Workflow global du module Alumni</title>
<desc>Trois parcours reliés : onboarding automatique après diplomation, campagne d'enquête pilotée par le Responsable Alumni, et mise à jour de profil par l'Alumni, avec bouclage vers la base Alumni.</desc>
<defs>
  <marker id="arrowN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c7cce0"/>
  </marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2952e3"/>
  </marker>
</defs>

<rect x="0" y="0" width="1180" height="730" fill="#f5f6fa"/>

<!-- ===== Lane captions ===== -->
<text x="110" y="45" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#545b70">PARCOURS 1 · ONBOARDING AUTOMATIQUE — Système / SIS</text>
<text x="110" y="292" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#545b70">PARCOURS 2 · CAMPAGNE D'ENQUÊTE — Responsable Alumni</text>
<text x="110" y="542" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#545b70">PARCOURS 3 · MISE À JOUR DU PROFIL — Alumni</text>

<!-- ===== ROW 1 : Onboarding ===== -->
<g font-family="Arial, sans-serif">
  <rect x="110" y="60" width="140" height="90" rx="10" fill="#ffffff" stroke="#c7cce0" stroke-width="1.5"/>
  <text x="180" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">Étudiant</text>
  <text x="180" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">diplômé</text>

  <rect x="272" y="60" width="140" height="90" rx="10" fill="#ffffff" stroke="#2952e3" stroke-width="2"/>
  <text x="342" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">Statut</text>
  <text x="342" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">→ « Diplômé »</text>

  <rect x="434" y="60" width="140" height="90" rx="10" fill="#ffffff" stroke="#2952e3" stroke-width="2"/>
  <text x="504" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1f36">Création auto</text>
  <text x="504" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1f36">profil Alumni</text>

  <rect x="596" y="60" width="140" height="90" rx="10" fill="#ffffff" stroke="#2952e3" stroke-width="2"/>
  <text x="666" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">Email</text>
  <text x="666" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">d'invitation</text>

  <rect x="758" y="60" width="140" height="90" rx="10" fill="#ffffff" stroke="#c7cce0" stroke-width="1.5"/>
  <text x="828" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">Profil Alumni</text>
  <text x="828" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">actif</text>

  <line x1="250" y1="105" x2="270" y2="105" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="412" y1="105" x2="432" y2="105" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="574" y1="105" x2="594" y2="105" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="736" y1="105" x2="756" y2="105" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
</g>

<!-- ===== ROW 2 : Campagne ===== -->
<g font-family="Arial, sans-serif">
  <rect x="110" y="310" width="140" height="90" rx="10" fill="#ffffff" stroke="#c7cce0" stroke-width="1.5"/>
  <text x="180" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">Ciblage</text>
  <text x="180" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">de l'audience</text>

  <rect x="272" y="310" width="140" height="90" rx="10" fill="#ffffff" stroke="#c7cce0" stroke-width="1.5"/>
  <text x="342" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1f36">Choix du</text>
  <text x="342" y="364" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1f36">questionnaire</text>

  <rect x="434" y="310" width="140" height="90" rx="10" fill="#ffffff" stroke="#c7cce0" stroke-width="1.5"/>
  <text x="504" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1f36">Programmation</text>
  <text x="504" y="364" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1f36">de l'envoi</text>

  <rect x="596" y="310" width="140" height="90" rx="10" fill="#ffffff" stroke="#2952e3" stroke-width="2"/>
  <text x="666" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1f36">Envoi auto +</text>
  <text x="666" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1f36">relances J+7/J+14</text>

  <rect x="758" y="310" width="140" height="90" rx="10" fill="#ffffff" stroke="#c7cce0" stroke-width="1.5"/>
  <text x="828" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">Analyse &amp;</text>
  <text x="828" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">reporting</text>

  <line x1="250" y1="355" x2="270" y2="355" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="412" y1="355" x2="432" y2="355" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="574" y1="355" x2="594" y2="355" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="736" y1="355" x2="756" y2="355" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>

  <rect x="960" y="315" width="170" height="80" rx="10" fill="#eaefff" stroke="#e3e6ef" stroke-width="1.5"/>
  <text x="1045" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1f36">Direction /</text>
  <text x="1045" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1f36">Accréditations</text>
  <text x="1045" y="380" text-anchor="middle" font-size="10" fill="#8791a8">export CSV</text>
  <line x1="898" y1="355" x2="958" y2="355" stroke="#e3e6ef" stroke-width="1.5" marker-end="url(#arrowN)"/>
</g>

<!-- ===== ROW 3 : Mise à jour profil ===== -->
<g font-family="Arial, sans-serif">
  <rect x="110" y="560" width="150" height="90" rx="10" fill="#ffffff" stroke="#2952e3" stroke-width="2"/>
  <text x="185" y="590" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1f36">Règle déclenchée</text>
  <text x="185" y="606" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1f36">(12 mois sans maj)</text>

  <rect x="282" y="560" width="150" height="90" rx="10" fill="#ffffff" stroke="#2952e3" stroke-width="2"/>
  <text x="357" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">Notification</text>
  <text x="357" y="614" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">Alumni</text>

  <rect x="454" y="560" width="150" height="90" rx="10" fill="#ffffff" stroke="#c7cce0" stroke-width="1.5"/>
  <text x="529" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">Connexion &amp;</text>
  <text x="529" y="614" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f36">modification</text>

  <rect x="626" y="560" width="150" height="90" rx="10" fill="#ffffff" stroke="#c7cce0" stroke-width="1.5"/>
  <text x="701" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1f36">Validation</text>
  <text x="701" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1f36">→ maj score</text>

  <line x1="260" y1="605" x2="280" y2="605" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="432" y1="605" x2="452" y2="605" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <line x1="604" y1="605" x2="624" y2="605" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
</g>

<!-- ===== Cross-row connectors ===== -->
<path d="M828,150 L828,220 L180,220 L180,308" fill="none" stroke="#c7cce0" stroke-width="1.5" marker-end="url(#arrowN)"/>
<text x="500" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#8791a8">alimente la base Alumni</text>

<path d="M828,400 L828,470 L185,470 L185,558" fill="none" stroke="#2952e3" stroke-width="1.5" marker-end="url(#arrowA)"/>
<text x="500" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#8791a8">automatisation « Quand… Alors… »</text>

<path d="M776,605 L1080,605 L1080,105 L900,105" fill="none" stroke="#2952e3" stroke-width="1.5" marker-end="url(#arrowA)"/>
<text x="1100" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#8791a8" transform="rotate(90 1100,360)">profil réactualisé</text>

<!-- ===== Legend ===== -->
<g font-family="Arial, sans-serif">
  <rect x="110" y="685" width="16" height="16" rx="4" fill="#ffffff" stroke="#2952e3" stroke-width="2"/>
  <text x="134" y="697" font-size="11.5" fill="#545b70">Étape automatisée</text>
  <rect x="300" y="685" width="16" height="16" rx="4" fill="#ffffff" stroke="#c7cce0" stroke-width="1.5"/>
  <text x="324" y="697" font-size="11.5" fill="#545b70">Action manuelle</text>
</g>
</svg>
